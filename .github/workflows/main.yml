name: Criar APK

on:
  workflow_dispatch:
  push:

jobs:
  build-android:
    name: Criar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Compilar APK
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          workdir: .
          buildozer_version: stable

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: MEU-CARRO-APK
          path: ${{ steps.buildozer.outputs.filename }}
